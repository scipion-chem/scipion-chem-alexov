name: Build plugin

on:
  pull_request:
    branches: [devel, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:        
      - name: Setup enviroment
        uses: scipion-chem/.github/.github/composites/install-scipion@03a4e0cc2d6bb2e45e00ff8d267c40fc74d9bfbe # main

      - name: Clone scipion-chem (in branch ${{ github.head_ref }} if exists, then tries ${{ github.base_ref }}, finally, default branch)
        uses: scipion-chem/.github/.github/composites/clone-in-branch@03a4e0cc2d6bb2e45e00ff8d267c40fc74d9bfbe # main
        with:
          path: ${{ github.workspace }}/../
          repo_url: https://github.com/scipion-chem/scipion-chem
          prioritized_branches: "${{ github.head_ref }},${{ github.base_ref }}"
      
      - name: Install scipion-chem
        working-directory: ${{ github.workspace }}/../
        run: scipion/scipion3 installp -p scipion-chem/ --devel
      
      - name: Checkout repository
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # main
        with:
          ref: ${{ github.head_ref }}
  
      - name: Install plugin from pull request
        working-directory: ${{ github.workspace }}
        run: ../scipion/scipion3 installp -p . --devel
  
      - name: Run tests
        working-directory: ${{ github.workspace }}/alexov
        run: |
          pip install --user scipion-testrunner
          scipion_testrunner ${{ github.workspace }}/../scipion/scipion3 alexov --noGpu --testData=testData.json
